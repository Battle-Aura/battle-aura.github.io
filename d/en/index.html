<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>BattleAura – Challenge</title>
  <meta property="og:title" content="⚔️ You've been challenged on BattleAura!" />
  <meta property="og:description" content="Beat their aura score. No app? It's free." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://battle-aura.github.io/d/en/" />
  <meta property="og:image" content="https://battle-aura.github.io/d/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07060d; color: #f4f1ff;
      font: 17px/1.5 system-ui, sans-serif; text-align: center; padding: 20px; box-sizing: border-box; }
    h1 { font-size: 34px; margin: 0 0 6px; } h1 span { color: #39ff88; }
    .btn { display: block; margin: 12px auto 0; max-width: 320px; padding: 14px; border-radius: 12px;
      background: #39ff88; color: #04220f; font-weight: 800; text-decoration: none; }
    .ghost { background: none; color: #9a93b8; border: 1px solid #3a3452; }
    .hint { color: #9a93b8; font-size: 14px; margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>⚔️ BATTLE<span>AURA</span></h1>
    <p id="msg">You've been challenged! Open BattleAura to take it on.</p>
    <a class="btn" id="open" href="#">🔥 OPEN THE CHALLENGE</a>
    <a class="btn ghost" id="store" href="#">📲 Get the app (free)</a>
    <p class="hint" id="hint">Don't have the app yet? Install it, then open this link again to play the challenge.</p>
  </main>
  <script src="../redirect.js"></script>
</body>
</html>
